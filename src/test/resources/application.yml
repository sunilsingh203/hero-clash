spring:
  datasource:
    url: jdbc:h2:mem:heroclash;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

heroclash:
  seed:
    enabled: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
